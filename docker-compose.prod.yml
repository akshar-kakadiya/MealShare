version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 Relational & Spatial Core
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mealshare-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mealshare_app}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - mealshare-prod-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mealshare_app}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Spring Boot Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mealshare-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mealshare_app}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://mealshare-100.web.app,https://mealshare-100.firebaseapp.com,http://localhost:5173}
      FIREBASE_CREDENTIALS_PATH: /app/mealshare-100-firebase-adminsdk-fbsvc-8964cd362d.json
    ports:
      - '8081:8081'
    networks:
      - mealshare-prod-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/api/v1/health']
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  mealshare-prod-network:
    driver: bridge

volumes:
  pgdata_prod:
