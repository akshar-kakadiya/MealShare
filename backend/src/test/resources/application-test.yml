spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mealshare_app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

firebase:
  credentials:
    path:
  database:
    url: ${FIREBASE_DATABASE_URL:https://mealshare-100-default-rtdb.firebaseio.com}

mealshare:
  pickup:
    otp:
      length: 6
      expiry-minutes: 10
      max-attempts: 5
  donation:
    expiry-cron: "-"

google:
  maps:
    api-key: test-api-key
    routes-url: https://routes.googleapis.com/directions/v2:computeRoutes
