server:
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    context-path: /

spring:
  application:
    name: mealshare-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mealshare_app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}
  database:
    url: ${FIREBASE_DATABASE_URL:https://mealshare-100-default-rtdb.firebaseio.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://mealshare-100.web.app,https://mealshare-100.firebaseapp.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mealshare:
  pickup:
    otp:
      length: 6
      expiry-minutes: 10
      max-attempts: 5
  donation:
    expiry-cron: ${DONATION_EXPIRY_CRON:0 */5 * * * *}

google:
  maps:
    api-key: ${GOOGLE_MAPS_SERVER_API_KEY:${GOOGLE_MAPS_API_KEY:}}
    routes-url: ${GOOGLE_MAPS_ROUTES_URL:https://routes.googleapis.com/directions/v2:computeRoutes}
