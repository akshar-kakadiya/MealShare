server:
  port: ${PORT:8081}
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 20
      min-spare: 4
    max-connections: 100
    accept-count: 20

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
      pool-name: MealShareHikariPoolProd
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://mealshare-100.web.app,https://mealshare-100.firebaseapp.com}

mealshare:
  evidence:
    storage-dir: ${EVIDENCE_STORAGE_DIR:/app/uploads/evidence}
  pickup:
    otp:
      length: 6
      expiry-minutes: 10
      max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
